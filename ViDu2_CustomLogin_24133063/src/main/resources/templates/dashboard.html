<!DOCTYPE html>
<html lang="vi" layout:decorate="~{layouts/base}" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org">
 <head>
  <title>
   Bảng điều khiển
  </title>
 </head>
 <body>
  <main class="container" layout:fragment="content">
   <div class="page-heading">
    <div>
     <span class="section-label">
      TÀI KHOẢN CỦA BẠN
     </span>
     <h1>
      Xin chào,
      <span th:text="${currentUser.fullName}">
       Bạn
      </span>
      👋
     </h1>
     <p class="muted">
      Thông tin được truy xuất từ session bảo mật.
     </p>
    </div>
    <a class="btn btn-outline" th:href="@{/}">
     ← Trang chủ
    </a>
   </div>
   <div class="grid">
    <article class="card">
     <div class="card-icon">
      ◉
     </div>
     <h3>
      Ảnh đại diện
     </h3>
     <img alt="Ảnh đại diện" class="avatar" style="width:80px;height:80px" th:src="${currentUser.images != null ? currentUser.images : '/images/avatar-default.svg'}"/>
    </article>
    <article class="card">
     <div class="card-icon mint">
      ◎
     </div>
     <h3>
      Username
     </h3>
     <div class="card-value" style="font-size:22px" th:text="${currentUser.username}">
      username
     </div>
     <p th:text="${currentUser.email}">
      email
     </p>
    </article>
    <article class="card">
     <div class="card-icon peach">
      ✦
     </div>
     <h3>
      Quyền truy cập
     </h3>
     <div class="card-value" style="font-size:22px" th:text="${currentUser.roleName}">
      USER
     </div>
     <a class="text-link" th:href="@{/admin}" th:if="${currentUser.roleName == 'ADMIN'}">
      Trang quản trị →
     </a>
    </article>
   </div>
  </main>
 </body>
</html>
