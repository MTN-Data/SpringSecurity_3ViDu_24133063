spring.config.import=optional:file:.env[.properties]
spring.application.name=uteshop-full-security
server.port=${PORT:8082}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/vidu3;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
server.servlet.session.timeout=60m
server.error.include-message=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.demo.seed=${DEMO_SEED:true}
app.demo.show-otp=${DEMO_SHOW_OTP:true}
app.mail.enabled=${MAIL_ENABLED:false}
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.profiles.default=sqlserver
